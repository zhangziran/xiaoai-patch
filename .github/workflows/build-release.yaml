name: Build Release

permissions:
  contents: write
  id-token: write
  attestations: write
  packages: write

on:
  workflow_dispatch:

jobs:
  image:
    name: Image
    runs-on: ubuntu-latest
    env:
      MODEL: lx01
    steps:
      - uses: actions/checkout@v6

      - name: Pull base image
        id: base
        env:
          IMAGE: ghcr.io/duhow/xiaoai-patch/lx01:base
        run: |
          sudo make pull MODEL=lx01

          VERSION=`docker inspect ${IMAGE} | jq -r '.[0].Config.Labels["org.opencontainers.image.version"]'`
          echo "version=${VERSION}" >> ${GITHUB_OUTPUT}

          UPDATE=`docker inspect ${IMAGE} | jq -r '.[0].Config.Labels["org.opencontainers.image.source"]'`
          wget -q -O mico_lx01.bin "${UPDATE}"

          ./tools/mico_firmware.py -d mico_lx01 -e mico_lx01.bin -i
          ln -svf kernel.img mico_lx01/boot.img
          ln -svf rootfs.img mico_lx01/root.squashfs

      - name: Download prebuilt packages from upstream
        run: |
          mkdir -p build-packages/s2t/armv7
          wget -q -O bin-armv7.tar.gz "https://github.com/duhow/xiaoai-patch/releases/latest/download/bin-armv7.tar.gz" || true
          if [ -s bin-armv7.tar.gz ]; then
            sudo tar xzvf bin-armv7.tar.gz -C build-packages/s2t/armv7
          fi

      - name: Patch scripts for original Xiaoai
        run: |
          rm -f scripts/20_disable_services.sh
          rm -f scripts/21_patch_service_bluetooth.sh
          rm -f scripts/24_remove_property_bin.sh
          rm -f scripts/40_sounds.sh
          rm -rf build-packages/s2t/armv7/whisper* 2>/dev/null || true
          rm -rf build-packages/s2t/armv7/porcupine* 2>/dev/null || true
          rm -rf build-packages/s2t/armv7/mpd* 2>/dev/null || true
          rm -rf build-packages/s2t/armv7/shairport-sync* 2>/dev/null || true

      - name: Build artifact
        run: sudo -E make patch build release MODEL=lx01

      - name: Prepare artifact
        id: artifact
        run: |
          FILE=`ls -1 release/lx01/mico_*.tar | head -n 1`
          NAME=`basename ${FILE}`
          echo "name=${NAME}" >> ${GITHUB_OUTPUT}
          cp -vf ${FILE} .

      - name: Upload artifact to Workflow Run
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: ${{ steps.artifact.outputs.name }}
          retention-days: 10
          if-no-files-found: error
