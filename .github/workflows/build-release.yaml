name: Build Release

permissions:
  contents: write
  id-token: write
  attestations: write
  packages: write

on:
  workflow_dispatch:

jobs:
  image:
    name: Image
    runs-on: ubuntu-latest
    env:
      MODEL: lx01
    steps:
      - uses: actions/checkout@v6

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y squashfs-tools python3 wget openssl

      - name: Download and extract official Xiaomi 1.62.6 firmware
        run: |
          rm -rf mico_lx01 squashfs-root
          wget -O mico_lx01.bin "https://cdn.cnbj1.fds.api.mi-img.com/xiaoqiang/rom/lx01/mico_firmware_4215788a8_1.62.6.bin"
          python3 ./tools/mico_firmware.py -d mico_lx01 -e mico_lx01.bin -i
          ln -svf kernel.img mico_lx01/boot.img
          ln -svf rootfs.img mico_lx01/root.squashfs
          sudo unsquashfs -d squashfs-root mico_lx01/root.squashfs

      - name: Enable Root, Serial Shell, SSH and SCP (keep all Xiaomi features)
        run: |
          # 1. 开启串口免密 root shell
          sudo sed -i 's|::askconsole:/bin/login|::askconsole:/bin/ash --login|g' squashfs-root/etc/inittab
          sudo sed -i 's|ttyS0::askfirst:/bin/login|ttyS0::askfirst:/bin/ash --login|g' squashfs-root/etc/inittab

          # 2. 将 root 密码修改为 root（同时保留原厂认证兼容性）
          HASH=$(openssl passwd -5 "root")
          sudo sed -i "s|^root:[^:]*:|root:${HASH}:|" squashfs-root/etc/shadow

          # 3. 解除 PAM 登录限制，允许密码登录 SSH
          if [ -f squashfs-root/etc/pam.d/common-auth ]; then
            sudo sed -i 's/^auth/#auth/g' squashfs-root/etc/pam.d/common-auth
            echo "auth sufficient pam_permit.so" | sudo tee -a squashfs-root/etc/pam.d/common-auth
          fi

          # 4. 开启 dropbear (SSH + SCP) 开机自启
          if [ -f squashfs-root/etc/init.d/dropbear ]; then
            sudo ln -sf /etc/init.d/dropbear squashfs-root/etc/rc.d/S50dropbear
            sudo ln -sf /etc/init.d/dropbear squashfs-root/etc/rc.d/K50dropbear
          fi

          # 5. 保留原厂 ssh 公钥软链接支持（方便后续免密）
          sudo mkdir -p squashfs-root/root
          sudo ln -sfn /data/ssh squashfs-root/root/.ssh

      - name: Pack firmware image
        id: artifact
        run: |
          sudo -E make build release MODEL=lx01
          FILE=$(ls -1 release/lx01/mico_*.tar | head -n 1)
          NAME=$(basename "${FILE}")
          echo "name=${NAME}" >> ${GITHUB_OUTPUT}
          cp -vf "${FILE}" .

      - name: Upload artifact to Workflow Run
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: ${{ steps.artifact.outputs.name }}
          retention-days: 10
          if-no-files-found: error
