name: Build Release

permissions:
  contents: write
  id-token: write
  attestations: write
  packages: write

on:
  workflow_dispatch:

jobs:
  image:
    name: Image
    runs-on: ubuntu-latest
    env:
      MODEL: lx01
    steps:
      - uses: actions/checkout@v6

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y squashfs-tools python3 wget openssl

      - name: Download and extract official Xiaomi 1.62.6 firmware
        run: |
          rm -rf mico_lx01 squashfs-root
          wget -O mico_lx01.bin "https://cdn.cnbj1.fds.api.mi-img.com/xiaoqiang/rom/lx01/mico_firmware_4215788a8_1.62.6.bin"
          python3 ./tools/mico_firmware.py -d mico_lx01 -e mico_lx01.bin -i
          ln -svf kernel.img mico_lx01/boot.img
          ln -svf rootfs.img mico_lx01/root.squashfs
          sudo unsquashfs -d squashfs-root mico_lx01/root.squashfs

      - name: Enable Writable Etc/Root, Serial Shell, SSH and SCP (Strict Password)
        run: |
          # 1. 开启串口免密 root shell
          sudo sed -i 's|::askconsole:/bin/login|::askconsole:/bin/ash --login|g' squashfs-root/etc/inittab
          sudo sed -i 's|ttyS0::askfirst:/bin/login|ttyS0::askfirst:/bin/ash --login|g' squashfs-root/etc/inittab

          # 2. 使用全系统兼容的 MD5 (-1) 哈希预设 root 密码为 root，删除会引发验证报错的 pam_unix.so
          HASH=$(openssl passwd -1 "root")
          sudo sed -i "s|^root:[^:]*:|root:${HASH}:|" squashfs-root/etc/shadow
          sudo rm -f squashfs-root/etc/pam.d/common-auth

          # 3. 注入开机自动绑定挂载 /etc 和 /root 到可写的 /data 分区（支持 passwd 改密与 uci 保存配置，重启永久生效）
          sudo tee squashfs-root/etc/init.d/writable_cfg << 'EOF'
          #!/bin/sh /etc/rc.common
          START=10
          start() {
              mkdir -p /data/overlay/etc /data/overlay/root
              if [ ! -f /data/overlay/etc/.init_ok ]; then
                  cp -a /etc/* /data/overlay/etc/
                  touch /data/overlay/etc/.init_ok
              fi
              if [ ! -f /data/overlay/root/.init_ok ]; then
                  cp -a /root/* /data/overlay/root/ 2>/dev/null || true
                  touch /data/overlay/root/.init_ok
              fi
              mount --bind /data/overlay/etc /etc
              mount --bind /data/overlay/root /root
          }
          EOF
          sudo chmod +x squashfs-root/etc/init.d/writable_cfg
          sudo ln -sf /etc/init.d/writable_cfg squashfs-root/etc/rc.d/S10writable_cfg

          # 4. 开启 dropbear (SSH + SCP) 开机自启与密码登录
          sudo python3 -c '
          path = "squashfs-root/etc/init.d/dropbear"
          with open(path, "r") as f:
              content = f.read()
          content = content.replace("\x27PasswordAuth:bool:0\x27", "\x27PasswordAuth:bool:1\x27")
          content = content.replace("\x27RootPasswordAuth:bool:0\x27", "\x27RootPasswordAuth:bool:1\x27")
          target = "if [ \"$ssh_en\" != \"1\" -a \"$ssh_en_bind\" != \"1\" -a \"$ssh_en_tmp\" != \"1\" -a \"$channel\" = \"release\" ]; then"
          content = content.replace(target, "if false; then")
          with open(path, "w") as f:
              f.write(content)
          '
          sudo ln -sf /etc/init.d/dropbear squashfs-root/etc/rc.d/S50dropbear
          sudo ln -sf /etc/init.d/dropbear squashfs-root/etc/rc.d/K50dropbear

          # 5. 保留原厂 ssh 公钥软链接支持并补齐 update.sh
          sudo mkdir -p squashfs-root/root
          sudo ln -sfn /data/ssh squashfs-root/root/.ssh
          sudo cp -vf bin/update.sh squashfs-root/bin/update.sh

      - name: Pack firmware image
        id: artifact
        run: |
          sudo -E make build release MODEL=lx01
          FILE=$(ls -1 release/lx01/mico_*.tar | head -n 1)
          NAME=$(basename "${FILE}")
          echo "name=${NAME}" >> ${GITHUB_OUTPUT}
          cp -vf "${FILE}" .

      - name: Upload artifact to Workflow Run
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: ${{ steps.artifact.outputs.name }}
          retention-days: 10
          if-no-files-found: error
